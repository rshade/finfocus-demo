name: Cost Estimate

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly health check: catches an expired AWS role, a deleted secret, or a broken release
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write  # Required for OIDC

env:
  # Enable debug logging for all actions
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true
  # Disable tool caching
  ACTIONS_CACHE_DISABLED: true

jobs:
  cost-estimate:
    name: cost-estimate (${{ matrix.channel }})
    runs-on: ubuntu-latest
    # action-main runs unreleased finfocus-action code as an early warning; it may fail without failing the run
    continue-on-error: ${{ matrix.channel == 'action-main' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [release, action-main]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6
        with:
          pulumi-version: latest

      - name: Login to Pulumi local backend
        run: pulumi login --local

      - name: Install AWS Pulumi plugin
        run: pulumi plugin install resource aws -v 3

      - name: Initialize stack
        run: pulumi stack init dev --non-interactive || pulumi stack select dev
        env:
          PULUMI_CONFIG_PASSPHRASE: ""

      - name: Generate preview JSON
        run: |
          echo "=== Starting Pulumi Preview ==="
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo ""
          echo "Pulumi version:"
          pulumi version
          echo ""
          echo "Pulumi stack:"
          pulumi stack --show-name
          echo ""
          echo "=== Running pulumi preview --json ==="
          # Use --logtostderr to send logs to stderr, stdout gets clean JSON
          # Add --debug for verbose Pulumi output
          pulumi preview --json --non-interactive --logtostderr --debug > plan.json
          PREVIEW_EXIT=$?

          echo ""
          echo "=== Preview completed with exit code: $PREVIEW_EXIT ==="
          echo "Plan file size: $(wc -c < plan.json) bytes"
          echo "Plan file lines: $(wc -l < plan.json) lines"
          echo ""

          # Show first part of plan file for debugging
          echo "=== Plan file content (first 1000 chars) ==="
          head -c 1000 plan.json
          echo ""
          echo ""

          # Validate JSON
          echo "=== Validating JSON ==="
          if python3 -c "import json; json.load(open('plan.json'))" 2>/dev/null; then
            echo "✅ Plan JSON is valid"
          else
            echo "❌ Plan JSON is NOT valid"
            echo "Full file contents:"
            cat plan.json
            exit 1
          fi
        env:
          PULUMI_CONFIG_PASSPHRASE: ""
          PULUMI_DEBUG_COMMANDS: true

      - name: Run FinFocus Cost Estimation (release)
        if: matrix.channel == 'release'
        uses: rshade/finfocus-action@v2.0.0
        env:
          # Enable Node.js debug output
          NODE_DEBUG: '*'
        with:
          pulumi-plan-json: plan.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-plugins: aws-public
          post-comment: "true"
          debug: "true"
          include-recommendations: true
          budget-amount: 105
          budget-currency: USD
          budget-period: monthly
          budget-alerts: '[{"threshold": 80, "type": "actual"}, {"threshold": 100, "type": "forecasted"}]'
          # What-if: price a standalone t3.large (no baseline in single-resource mode)
          estimate-spec: >-
            {"provider": "aws", "resource_type": "aws:ec2/instance:Instance",
            "properties": {"instanceType": "t3.large"}, "region": "us-east-1"}

      - name: Run FinFocus Cost Estimation (finfocus-action@main, early warning)
        if: matrix.channel == 'action-main'
        uses: rshade/finfocus-action@main
        with:
          pulumi-plan-json: plan.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-plugins: aws-public
          # The release job owns the PR comment
          post-comment: "false"
          debug: "true"
          include-recommendations: true
          budget-amount: 105
          budget-currency: USD
          budget-period: monthly
          budget-alerts: '[{"threshold": 80, "type": "actual"}, {"threshold": 100, "type": "forecasted"}]'
          estimate-spec: >-
            {"provider": "aws", "resource_type": "aws:ec2/instance:Instance",
            "properties": {"instanceType": "t3.large"}, "region": "us-east-1"}
